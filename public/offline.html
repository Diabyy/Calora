<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Offline Mode - Calora Field Manual</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #111827;
      color: #f4f2ed;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #1c2533;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 28px;
      max-width: 440px;
      width: 100%;
      padding: 36px 28px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(252, 76, 2, 0.18);
      color: #ff7a45;
      border: 1px solid rgba(252, 76, 2, 0.35);
      border-radius: 9999px;
      padding: 6px 14px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 20px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #fc4c02;
    }
    h1 {
      font-size: 32px;
      font-weight: 900;
      line-height: 1.1;
      text-transform: uppercase;
      letter-spacing: -0.02em;
      margin-bottom: 14px;
      color: #ffffff;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .highlight {
      color: #c8f169;
      font-weight: 700;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      background: #c8f169;
      color: #111827;
      font-weight: 800;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 16px 24px;
      border-radius: 9999px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:hover {
      opacity: 0.9;
    }
    .footnote {
      margin-top: 20px;
      font-size: 11px;
      color: #64748b;
      font-weight: 600;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">
      <span class="dot"></span>
      Mode Luar Jaringan (Offline)
    </div>
    <h1>Koneksi Seluler Terputus</h1>
    <p>
      Anda sedang berada di area tanpa sinyal. Tenang, <span class="highlight">Live GPS Tracker tetap mencatat titik koordinat Anda secara lokal</span> di perangkat Anda.
    </p>
    <button class="btn" onclick="window.location.reload()">Coba Sambungkan Ulang</button>
    <div class="footnote">
      CALORA FIELD MANUAL · OFFLINE RESILIENCE ACTIVE
    </div>
  </div>
</body>
</html>
